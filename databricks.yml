# Databricks Asset Bundle: deploys the SDP pipeline alongside the governance flow.
# Docs: https://docs.databricks.com/dev-tools/bundles
#
# Division of labour with infra/:
#   Terraform owns the durable, security-relevant substrate — workspace,
#   storage, service principals, catalogs and catalog grants.
#   This bundle owns the application artifacts — schemas, the landing volume and
#   the pipeline. That split is what lets an engineer run
#   `databricks bundle deploy --target dev` and get their own personally-
#   prefixed schemas without a Terraform change.

bundle:
  name: dlt-refresh-gitops

resources:
  schemas:
    bronze:
      catalog_name: ${var.catalog}
      name: bronze
      comment: "Raw ingest and cleaned tables produced by the orders pipeline."
    silver:
      catalog_name: ${var.catalog}
      name: silver
      comment: "Modelled tables built on top of bronze."

  volumes:
    # Auto Loader source. Lives in bronze rather than a schema of its own —
    # unstructured arrivals belong to the raw layer, not beside it.
    landing:
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.bronze.name}
      name: landing
      volume_type: MANAGED
      comment: "Auto Loader source files, one subdirectory per source."

  pipelines:
    orders_pipeline:
      name: "orders-pipeline-${bundle.target}"
      catalog: ${var.catalog}
      schema: ${resources.schemas.bronze.name}
      serverless: false
      photon: true
      # Classic compute, so the pipeline brings its own cluster. Declaring only
      # the `default` label means the maintenance cluster (nightly OPTIMIZE and
      # VACUUM) inherits this same shape rather than falling back to a
      # workspace default nobody chose.
      clusters:
        - label: default
          node_type_id: ${var.node_type_id}
          driver_node_type_id: ${var.node_type_id}
          # Fixed size, not autoscale: at this volume the autoscaler would spend
          # the whole update deciding, and a constant cluster shape makes one
          # environment's run time directly comparable to another's. Raise
          # num_workers per target if a full refresh starts outgrowing it.
          num_workers: ${var.num_workers}
          custom_tags:
            environment: ${bundle.target}
            managed_by: databricks-bundle
      libraries:
        - file:
            path: ./src/pipeline.py
      # Continuous=false: triggered updates only, so refreshes happen exactly
      # when the release workflow (or schedule) says so.
      continuous: false
      configuration:
        # Passed rather than hardcoded: in dev this resolves to the engineer's
        # own prefixed volume, so nobody ingests from a shared path by accident.
        source_path: "/Volumes/${var.catalog}/${resources.schemas.bronze.name}/${resources.volumes.landing.name}/orders"

targets:
  # Local iteration only — never deployed by CI. `mode: development` prefixes
  # every resource with the deploying user, so engineers don't collide: each
  # gets their own schemas, volume and pipeline inside the shared dev catalog.
  # Deployed as the engineer, not a service principal.
  dev:
    mode: development
    default: true
    variables:
      catalog: orders_dev

  # Shared integration environment, deployed on every merge to main.
  # `mode: production` despite the name — it's what gives stable, unprefixed
  # resource names, which a shared environment needs.
  tst:
    mode: production
    variables:
      catalog: orders_tst
    run_as:
      service_principal_name: ${var.service_principal_id}
    permissions:
      - level: CAN_MANAGE
        service_principal_name: ${var.service_principal_id}
      # Engineers can trigger updates and refreshes freely here — that's the
      # point of tst. The governance gate applies to prd only.
      - level: CAN_RUN
        group_name: engineers

  # Production. Deployed only from a v* tag; a full refresh additionally
  # requires an approved entry in governance/refresh-requests.yaml.
  prd:
    mode: production
    variables:
      catalog: orders_prd
    # In prd the pipeline runs as the service principal, not a human —
    # engineers hold no run/manage permission on the deployed pipeline, and no
    # SELECT on the catalog either (see infra/variables.tf).
    run_as:
      service_principal_name: ${var.service_principal_id}
    permissions:
      - level: CAN_MANAGE
        service_principal_name: ${var.service_principal_id}
      - level: CAN_VIEW
        group_name: engineers

variables:
  catalog:
    description: Unity Catalog catalog for this target. Created by infra/ (Terraform).
    # Defaulted to the dev catalog so the bundle needs no arguments on a
    # laptop. Every target sets this explicitly anyway, so the default is only
    # ever reachable from an unpinned local run — which is exactly the case
    # where landing in orders_dev is the safe outcome.
    default: orders_dev
  service_principal_id:
    description: Application ID of the execution service principal. Unused by the dev target.
    default: ""

  # Pipeline compute. Kept as scalars rather than one complex variable so a
  # target overrides only the dimension it cares about — prd could raise the
  # worker count without restating the node type. Every target uses the
  # defaults today; the knobs exist so growing one doesn't mean restructuring.
  node_type_id:
    description: Azure VM size for the pipeline's driver and workers.
    # General-purpose, local-SSD, current generation. Available in westeurope
    # (infra/platform/variables.tf), which is where the workspace lives.
    default: Standard_D4ds_v5
  num_workers:
    description: Workers in the pipeline cluster, on top of the driver.
    default: 1
