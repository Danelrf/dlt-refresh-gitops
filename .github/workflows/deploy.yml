name: Deploy

on:
  push:
    branches: [main]
    # Bare semver, no `v` prefix. `+` means "one or more of the preceding
    # character" in GitHub filter patterns, so this matches 1.2.3 but not
    # `latest`, `release-1` or a stray annotated tag.
    tags: ['[0-9]+.[0-9]+.[0-9]+']

# Serialise the whole pipeline: a merge to main and a tag push can no longer
# race on the tst target, since deploy-tst and deploy-prd now live in one
# workflow run anyway.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # PySpark 4 requires a JDK 17+.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Unit tests
        run: uv run pytest -q

  deploy-tst:
    needs: test
    runs-on: ubuntu-latest
    # The environment is not just where the config lives — it is the identity
    # boundary. The tst service principal's federation policy accepts only
    # tokens whose subject is `...:environment:tst`, so this job cannot
    # authenticate against prd even if it tried.
    environment: tst
    permissions:
      contents: read
      id-token: write
    env:
      # Workload identity federation: the Databricks CLI exchanges this job's
      # GitHub OIDC token for a short-lived Databricks OAuth token. No secret
      # exists to leak or rotate, and the token is only accepted because this
      # job declares the matching `environment:` below.
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
      BUNDLE_VAR_service_principal_id: ${{ vars.DATABRICKS_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate bundle
        run: databricks bundle validate --target tst

      - name: Deploy bundle (tst)
        run: databricks bundle deploy --target tst

  # Only on a release tag: deploy prd after tst, so every release re-deploys
  # tst first as a safety net and satisfies "tagging a release also
  # re-releases tst".
  deploy-prd:
    needs: deploy-tst
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: prd
    permissions:
      contents: read
      id-token: write
    env:
      # Workload identity federation: the Databricks CLI exchanges this job's
      # GitHub OIDC token for a short-lived Databricks OAuth token. No secret
      # exists to leak or rotate, and the token is only accepted because this
      # job declares the matching `environment:` below.
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
      BUNDLE_VAR_service_principal_id: ${{ vars.DATABRICKS_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate bundle
        run: databricks bundle validate --target prd

      - name: Deploy bundle (prd)
        run: databricks bundle deploy --target prd

  # Does this release request a refresh? Its own job so that "no request"
  # renders as a cleanly skipped refresh job rather than a silent no-op.
  check-refresh:
    needs: deploy-prd
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      match: ${{ steps.check.outputs.match }}
      pipeline_key: ${{ steps.check.outputs.pipeline_key }}
      reason: ${{ steps.check.outputs.reason }}
    steps:
      - uses: actions/checkout@v4

      - name: Match refresh request for this version
        id: check
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          REQUESTS=governance/refresh-requests.yaml

          COUNT=$(yq '[.[] | select(.release_version == env(VERSION))] | length' "$REQUESTS")
          if [ "$COUNT" -eq 0 ]; then
            echo "No refresh requested for $VERSION — deploy only."
            echo "match=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Two entries for one tag is a review mistake, not something to guess
          # at. Refusing beats refreshing the wrong pipeline.
          if [ "$COUNT" -gt 1 ]; then
            echo "::error::$COUNT refresh requests found for $VERSION; expected exactly 1"
            exit 1
          fi

          ENTRY=$(yq -o=json '.[] | select(.release_version == env(VERSION))' "$REQUESTS")
          PIPELINE_KEY=$(echo "$ENTRY" | yq -r '.pipeline_key')
          REASON=$(echo "$ENTRY" | yq -r '.reason')

          for field in PIPELINE_KEY REASON; do
            if [ -z "${!field}" ] || [ "${!field}" = "null" ]; then
              echo "::error::refresh request for $VERSION is missing $field"
              exit 1
            fi
          done

          echo "match=true" >> "$GITHUB_OUTPUT"
          echo "pipeline_key=$PIPELINE_KEY" >> "$GITHUB_OUTPUT"
          # Delimiter form: a multi-line reason would otherwise corrupt the file.
          {
            echo "reason<<__REASON_EOF__"
            echo "$REASON"
            echo "__REASON_EOF__"
          } >> "$GITHUB_OUTPUT"

  # Refresh. Skipped entirely unless a request was found.
  refresh:
    needs: [deploy-prd, check-refresh]
    if: startsWith(github.ref, 'refs/tags/') && needs.check-refresh.outputs.match == 'true'
    runs-on: ubuntu-latest
    environment: prd
    # The job now blocks until the refresh finishes, so it can be long. 360 is
    # the GitHub-hosted maximum; a refresh that outlives it is handled as
    # "outcome unknown" rather than being recorded as a failure.
    timeout-minutes: 360
    permissions:
      contents: read
      issues: write
      id-token: write
    env:
      # Workload identity federation: the Databricks CLI exchanges this job's
      # GitHub OIDC token for a short-lived Databricks OAuth token. No secret
      # exists to leak or rotate, and the token is only accepted because this
      # job declares the matching `environment:` below.
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
      BUNDLE_VAR_service_principal_id: ${{ vars.DATABRICKS_CLIENT_ID }}
      GH_TOKEN: ${{ github.token }}
      # Passed as env, never interpolated into a shell string: `reason` is
      # PR-authored text and would otherwise be a command-injection vector
      # on a runner holding the prd service principal secret.
      VERSION: ${{ github.ref_name }}
      PIPELINE_KEY: ${{ needs.check-refresh.outputs.pipeline_key }}
      REASON: ${{ needs.check-refresh.outputs.reason }}
      ACTOR: ${{ github.actor }}
    steps:
      # Full history: resolving the approver means finding the commit that last
      # touched the requests file, which a shallow clone cannot see.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      # Who authorised this refresh. The tagger (`github.actor`) merely shipped
      # the release; the CODEOWNERS approver on the pull request that added the
      # request is the identity that actually permitted a destructive action.
      - name: Resolve approver
        id: approval
        run: |
          REQUEST_SHA=$(git log -1 --format=%H -- governance/refresh-requests.yaml)
          if [ -z "$REQUEST_SHA" ]; then
            echo "approvers=unknown (requests file has no history)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PR=$(gh api "repos/$GITHUB_REPOSITORY/commits/$REQUEST_SHA/pulls" \
                 --jq '.[0].number // empty' 2>/dev/null || true)
          if [ -z "$PR" ]; then
            # Direct push to main, or the PR is unreachable. Recorded rather than
            # blocked: the approval gate is enforced by branch protection at merge
            # time, not here. An "unknown" in the audit record is itself the
            # signal that something bypassed it.
            echo "approvers=unknown (no pull request found for ${REQUEST_SHA:0:8})" >> "$GITHUB_OUTPUT"
            echo "pr=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          APPROVERS=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" --paginate \
            --jq '[.[] | select(.state == "APPROVED") | .user.login] | unique | join(", ")' \
            2>/dev/null || true)
          [ -n "$APPROVERS" ] || APPROVERS="unknown (no approving review on #${PR})"

          echo "approvers=$APPROVERS" >> "$GITHUB_OUTPUT"
          echo "pr=$PR" >> "$GITHUB_OUTPUT"

      # Idempotency: the audit issue doubles as the "already executed" record.
      # Any failure to determine this must block, never wave the refresh through.
      - name: Idempotency check
        id: dedupe
        run: |
          if ! ISSUES=$(gh issue list --repo "$GITHUB_REPOSITORY" \
              --label "refresh-audit" --state all \
              --search "\"$VERSION $PIPELINE_KEY\" in:title" \
              --json number,body); then
            echo "::error::could not query existing audit issues — refusing to refresh"
            exit 1
          fi

          # A record of a *failed* attempt must not block a retry — otherwise
          # fixing the cause and re-tagging would be silently skipped, and the
          # only way to retry would be deleting the evidence.
          #
          # Everything else blocks, including an issue still reading
          # "triggering": that means a previous run died between claiming and
          # finalising, so whether the refresh happened is unknown. Unknown
          # blocks, by rule 2.
          if ! BLOCKING=$(jq 'map(select((.body // "") | test("FAILED|OUTCOME UNKNOWN") | not)) | length' <<<"$ISSUES"); then
            echo "::error::could not interpret existing audit issues — refusing to refresh"
            exit 1
          fi
          case "$BLOCKING" in
            ''|*[!0-9]*)
              echo "::error::unexpected issue count '$BLOCKING' — refusing to refresh"
              exit 1
              ;;
          esac

          if [ "$BLOCKING" -gt 0 ]; then
            echo "A settled refresh is already recorded for $VERSION $PIPELINE_KEY — nothing to do."
            echo "already_run=true" >> "$GITHUB_OUTPUT"
          else
            ATTEMPTS=$(jq 'length' <<<"$ISSUES")
            if [ "$ATTEMPTS" -gt 0 ]; then
              echo "$ATTEMPTS previous attempt(s) recorded, all failed — retrying."
            fi
            echo "already_run=false" >> "$GITHUB_OUTPUT"
          fi

      # Claim before acting: if the issue can't be created we must not refresh.
      # A crash between refreshing and recording would otherwise leave prod
      # refreshed with no audit record — and because dedupe keys off that
      # record, a re-run would refresh a second time.
      - name: Open audit issue (claim)
        id: claim
        if: steps.dedupe.outputs.already_run == 'false'
        env:
          APPROVERS: ${{ steps.approval.outputs.approvers }}
          APPROVAL_PR: ${{ steps.approval.outputs.pr }}
        run: |
          printf '%s\n' \
            "**Reason:** $REASON" \
            "**Approved by:** $APPROVERS${APPROVAL_PR:+ (#$APPROVAL_PR)}" \
            "**Tagged by:** @$ACTOR" \
            "**Workflow run:** $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            "" \
            "Status: **triggering** — updated with the outcome when this run finishes." \
            > body.md
          URL=$(gh issue create --repo "$GITHUB_REPOSITORY" \
            --label "refresh-audit" \
            --title "Full refresh: $VERSION $PIPELINE_KEY" \
            --body-file body.md)
          echo "number=${URL##*/}" >> "$GITHUB_OUTPUT"

      - name: Trigger full refresh
        id: trigger
        if: steps.dedupe.outputs.already_run == 'false'
        run: |
          PIPELINE_ID=$(databricks bundle summary --target prd -o json \
            | jq -r --arg k "$PIPELINE_KEY" '.resources.pipelines[$k].id')
          if [ -z "$PIPELINE_ID" ] || [ "$PIPELINE_ID" = "null" ]; then
            echo "::error::pipeline_key '$PIPELINE_KEY' not found in the prd bundle"
            exit 1
          fi

          # Record the newest update before triggering, so the new update can be
          # told apart from whatever was already at the head of the list.
          BEFORE=$(databricks pipelines list-updates "$PIPELINE_ID" -o json \
            | jq -r '.updates[0].update_id // "none"')

          # Blocks until the update finishes. Without this the audit record could
          # only ever claim "triggered", and — worse — a refresh that failed
          # after triggering would still leave an audit issue behind, which the
          # idempotency check would then read as "already done" and refuse to
          # retry. Waiting is what makes rule 2 actually fail closed.
          set +e
          databricks bundle run "$PIPELINE_KEY" --target prd --full-refresh-all
          RUN_STATUS=$?
          set -e

          # Captured regardless of outcome: the record needs the update_id most
          # when the refresh failed and someone has to go and read the logs.
          UPDATE_ID=$(databricks pipelines list-updates "$PIPELINE_ID" -o json \
            | jq -r '.updates[0].update_id // "none"')
          if [ "$UPDATE_ID" = "$BEFORE" ]; then
            echo "::warning::no new update appeared for this refresh"
            UPDATE_ID="none"
          fi
          echo "update_id=$UPDATE_ID" >> "$GITHUB_OUTPUT"

          exit "$RUN_STATUS"

      # Runs even if the trigger failed, so the claimed issue always ends up
      # stating what actually happened, then gets locked.
      - name: Finalise and lock audit issue
        if: always() && steps.claim.outcome == 'success'
        env:
          NUMBER: ${{ steps.claim.outputs.number }}
          UPDATE_ID: ${{ steps.trigger.outputs.update_id }}
          TRIGGER_OUTCOME: ${{ steps.trigger.outcome }}
          APPROVERS: ${{ steps.approval.outputs.approvers }}
          APPROVAL_PR: ${{ steps.approval.outputs.pr }}
        run: |
          case "$TRIGGER_OUTCOME" in
            success)
              STATUS="**completed successfully**"
              ;;
            cancelled)
              # The job hit its timeout, or someone cancelled the run. The
              # refresh itself is almost certainly still going in Databricks, so
              # claiming failure here would be a lie. Say so plainly.
              STATUS="**OUTCOME UNKNOWN** — the workflow stopped waiting before the refresh finished. Check the Databricks update before re-tagging."
              ;;
            *)
              STATUS="**FAILED** — the refresh did not complete. Investigate before re-tagging."
              ;;
          esac
          # The approver is part of the hash: the record's whole purpose is to
          # bind an authorisation to an execution, so tampering with either half
          # must be detectable.
          HASH=$(printf '%s|%s|%s|%s|%s|%s' \
            "$VERSION" "$PIPELINE_KEY" "$REASON" "$APPROVERS" "$ACTOR" "$UPDATE_ID" \
            | sha256sum | cut -d' ' -f1)
          printf '%s\n' \
            "**Reason:** $REASON" \
            "**Approved by:** $APPROVERS${APPROVAL_PR:+ (#$APPROVAL_PR)}" \
            "**Tagged by:** @$ACTOR" \
            "**Databricks update_id:** $UPDATE_ID" \
            "**Workflow run:** $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            "" \
            "Status: $STATUS" \
            "" \
            "**Integrity hash:** \`$HASH\`" \
            > body.md
          gh issue edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --body-file body.md
          gh issue lock "$NUMBER" --repo "$GITHUB_REPOSITORY"
